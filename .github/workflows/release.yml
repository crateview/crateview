name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: crateview-production-writers
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/registry-ui/package-lock.json
            apps/website/package-lock.json
      - name: Check for pending package versions on current main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            exit 0
          fi
          npm ci --ignore-scripts
          plan=$(mktemp)
          trap 'rm -f "$plan"' EXIT
          npm run changeset -- status --output "$plan"
          pending=$(jq -c '[.releases[].name]' "$plan")
          if ! jq -e 'index("@crateview/website")' <<< "$pending" > /dev/null; then
            website=$(jq -er .version apps/website/package.json)
            version_commit=$(git log -1 --format=%H -S "\"version\": \"$website\"" HEAD -- apps/website/package.json)
            test -n "$version_commit"
            if ! git diff --quiet "$version_commit" HEAD -- ':(glob)docs/*/docs/v[0-9]*/**'; then
              echo "docs_patch=true" >> "$GITHUB_OUTPUT"
              pending=$(jq -c '. + ["@crateview/website"]' <<< "$pending")
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" = '[]' ]; then
            exit 0
          fi
          branch=changeset-release/main
          existing=$(gh pr list --base main --head "$branch" --json headRefOid --jq '.[0].headRefOid // empty')
          if [ -n "$existing" ]; then
            git fetch --no-tags origin "$branch"
            if [ "$(git rev-parse "$existing^")" = "$GITHUB_SHA" ]; then
              exit 0
            fi
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"
      - name: Maintain the Version Packages PR
        if: steps.plan.outputs.update == 'true'
        env:
          PUBLISHED_DOCS_PATCH: ${{ steps.plan.outputs.docs_patch }}
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run version:packages
      - name: Run required CI on the version PR
        if: steps.plan.outputs.current == 'true' && steps.plan.outputs.pending != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=changeset-release/main
          head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test -n "$head"
          runs=$(gh run list --workflow ci.yml --branch "$branch" --commit "$head" --limit 1 --json databaseId --jq length)
          if [ "$runs" -eq 0 ]; then
            gh workflow run ci.yml --ref "$branch"
          fi
      - name: Restore the verified main checkout
        if: steps.plan.outputs.update == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: steps.plan.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.plan.outputs.current == 'true'
      - name: Process independent releases
        id: publish
        if: steps.plan.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_RELEASE_PACKAGES: ${{ steps.plan.outputs.pending }}
        run: node scripts/release.mjs
      - name: Queue documentation promotion
        if: steps.publish.outputs.promote_docs == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-docs.yml --ref main
